<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mon Portfolio</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Styles spécifiques pour aligner avec le design des captures d'écran */
        :root {
            --brand-color: #6C63FF;
            --bg-light: #f8f9fd;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-light);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .contact-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h2 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .underline {
            width: 50px;
            height: 4px;
            background: var(--brand-color);
            margin: 0 auto 20px;
            border-radius: 2px;
        }

        /* Grille de contact */
        .contact-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Style des cartes */
        .contact-form-card, .contact-direct {
            background: var(--white);
            padding: 40px;
            border-radius: 25px;
            box-shadow: var(--shadow);
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fdfdfd;
            font-size: 1rem;
            transition: 0.3s;
            box-sizing: border-box; /* Important pour le padding */
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        .btn-grad {
            background: var(--brand-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: fit-content;
        }

        .btn-grad:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        /* Boutons de contact direct */
        .contact-direct h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        .direct-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        .whatsapp { background-color: #25D366; }
        .telegram { background-color: #0088cc; }

        .social-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="navbar"> 
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">Mon Portfolio</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="projet.html">Projets</a></li>
                <li><a href="passion.html">Passion</a></li>
                <li><a href="divertissement.html">Divertissement</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <div class="header-section">
            <h2>Travaillons ensemble</h2>
            <div class="underline"></div>
            <p>Disponible pour de nouvelles opportunités.</p>
        </div>

        <div class="contact-grid">
            <section class="contact-form-card">
                <form>
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" placeholder="Votre nom" required>
                    </div>
                    <div class="form-group">
                        <label>Numéro de téléphone</label>
                        <input type="tel" placeholder="+243 XXX XXX XXX">
                    </div>
                    <button type="submit" class="btn-grad">Envoyer mon message</button>
                </form>
            </section>

            <section class="contact-direct">
                <h3>Contact direct</h3>
                <div class="direct-buttons">
                    <a href="https://wa.me/243999521453" target="_blank" class="social-btn whatsapp">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                    <a href="https://t.me/ton_username" target="_blank" class="social-btn telegram">
                        <i class="fa-brands fa-telegram"></i> Telegram
                    </a>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bathley. Tous droits réservés</p>
    </footer>

</body>
</html>
